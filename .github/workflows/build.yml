name: Build Quick Math Solver

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

         - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        working-directory: QuickMathSolver-Fabric-1.21.11-source/QuickMathSolver
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuickMathSolver-JAR
          path: QuickMathSolver-Fabric-1.21.11-source/QuickMathSolver/build/libs/*.jar
